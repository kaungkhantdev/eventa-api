# Local development backing services for eventa-api.
# `docker compose up -d` → Postgres, Redis, RabbitMQ. Credentials match .env.example.
# (In production these are managed infra provisioned from eventa-infra; this file is dev-only.)
name: eventa

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: eventa
      POSTGRES_PASSWORD: eventa
      POSTGRES_DB: eventa
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eventa -d eventa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: eventa
      RABBITMQ_DEFAULT_PASS: eventa
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  # A dev mail catcher: everything the worker sends lands here instead of the
  # internet, and is read at http://localhost:8025. No account, no credentials,
  # and no way to reach a real attendee from a developer's machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web inbox
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  # Object storage for uploads — cover images, logos, profile photos.
  #
  # Not optional: the app has one storage backend, an S3 bucket, and this is
  # that bucket locally. MinIO speaks the S3 API, so the same adapter and the
  # same code path run here as in production — S3_ENDPOINT is the only
  # difference. Without it the API still boots, and every upload fails at the
  # browser's PUT.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # S3 API — what S3_ENDPOINT points at
      - '9001:9001' # web console, http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the bucket and makes it world-readable, then exits.
  #
  # Public reads are the point: the app stores the object's URL and renders it
  # in an <img>, so a browser fetches it with no credentials. Only reads —
  # writing still needs a presigned URL the API signed.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/eventa-uploads &&
      mc anonymous set download local/eventa-uploads
      "

volumes:
  pgdata:
  miniodata:
